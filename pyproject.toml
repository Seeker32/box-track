[project]
name = "box-track"
version = "0.2.0"
description = "Multi-camera cardboard box tracking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.60",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "lap>=0.5.13",
    "roboflow>=1.3.9",
    "supervision>=0.28.0",
    "inference-sdk>=0.9.0",
    "python-dotenv>=1.2.2",
    "trackers>=2.1.0",
]
